<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Rich Obsidian Stone) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22201C" />
      <stop offset="45%" stop-color="#161513" />
      <stop offset="100%" stop-color="#0D0C0B" />
    </linearGradient>

    <!-- Warm Gold Gradient for Monogram -->
    <linearGradient id="goldGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FCECD2" />
      <stop offset="20%" stop-color="#E5C38C" />
      <stop offset="50%" stop-color="#C89E5F" />
      <stop offset="80%" stop-color="#9E763E" />
      <stop offset="100%" stop-color="#DAB475" />
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCECD2" />
      <stop offset="30%" stop-color="#C89E5F" />
      <stop offset="70%" stop-color="#8F6F40" />
      <stop offset="100%" stop-color="#DFBA7F" />
    </linearGradient>

    <!-- Subtle Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#C89E5F" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#C89E5F" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGradient)" />
  <rect width="512" height="512" rx="116" fill="url(#coreGlow)" />

  <!-- Outer Luxury Gold Border -->
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none" stroke="url(#goldBorder)" stroke-width="12" stroke-opacity="0.85" />

  <!-- Inner Architectural Accent Ring -->
  <rect x="30" y="30" width="452" height="452" rx="86" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.35" />

